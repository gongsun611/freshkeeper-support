<h2>常见问题</h2>
<h3>如何添加食材？</h3>
<p>点击首页底部「+」，手动输入、语音录入或拍照识别皆可。</p>

<h3>为什么没收到提醒？</h3>
<p>请到「设置 → 通知 → 鲜存」中确认已开启通知权限。</p>

<h3>数据会丢失吗？</h3>
<p>数据默认存储在本地。开启 iCloud 同步后，换机、重装都不会丢失。</p>
